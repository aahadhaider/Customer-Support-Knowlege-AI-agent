<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 16px;
            text-align: center;
        }

        .chat-header h2 { font-size: 18px; }
        .chat-header p { font-size: 12px; opacity: 0.8; }

        .chat-box {
            height: 420px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-message {
            background: #dcf8c6;
            align-self: flex-end;
            border-radius: 12px 12px 0 12px;
        }

        .bot-message {
            background: #f1f1f1;
            align-self: flex-start;
            border-radius: 12px 12px 12px 0;
        }

        .escalated-message {
            background: #ffe5e5;
            border-left: 3px solid red;
        }

        .status-badge {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.6;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #eee;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }

        .chat-input button {
            background: #075e54;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
        }

        .chat-input button:hover { background: #128c7e; }

        .typing {
            font-size: 13px;
            color: #999;
            padding: 0 16px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>🤖 Customer Support Agent</h2>
            <p>Ask me anything about your account</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                👋 Hello! I am Customer Support Agent. How can I help you today?
            </div>
        </div>

        <div class="typing" id="typing"></div>

        <div class="chat-input">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your question..." 
                onkeypress="handleKey(event)"
            />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function handleKey(event) {
            if (event.key === "Enter") sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const message = input.value.trim();
            if (!message) return;

            // Show user message
            addMessage(message, "user");
            input.value = "";

            // Show typing indicator
            document.getElementById("typing").textContent = "Agent is typing...";

            // Send to backend
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message })
            });

            const data = await response.json();

            // Hide typing indicator
            document.getElementById("typing").textContent = "";

            // Show bot reply
            const isEscalated = data.escalated;
            const statusText = isEscalated 
                ? "🚨 Escalated to human agent" 
                : `✅ ${data.status} | 📁 ${data.category}`;

            addMessage(data.reply, "bot", statusText, isEscalated);
        }

        function addMessage(text, sender, status = "", escalated = false) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `message ${sender === "user" ? "user-message" : "bot-message"} ${escalated ? "escalated-message" : ""}`;
            div.innerHTML = `${text}${status ? `<div class="status-badge">${status}</div>` : ""}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
